<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ติดตั้งเป็นแอปได้ทุกหน้า (Lab 34) สีตรงกับ manifest.json -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#151B33">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>กางนิ้วผ่านกำแพง · HandRehab Arcade</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/parts.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body class="game-page world-sea">
  <header class="game-bar">
    <h1>🐠 กางนิ้วผ่านกำแพง</h1>
    <span class="chip">พลัง
      <span class="bar" style="width:120px;display:inline-block;vertical-align:middle"><i id="energyBar" style="width:100%"></i></span>
      <b id="energy" class="num">100</b></span>
    <span class="chip">คะแนน <b id="score" class="num">0</b></span>
    <span class="chip">ระดับ <b id="level" class="num">1</b></span>
    <span class="chip">มุมกาง <b id="deg" class="num">—</b>°</span>
    <span class="chip ok">สถิติวันนี้ <b id="maxDeg" class="num">0</b>° <small class="muted">เดิม <span id="prevBest">—</span>°</small></span>
    <span id="demoBadge" class="demo-badge hidden" title="หมุนล้อเมาส์บนจอ หรือเลื่อนแถบ มุมกาง แทนการกางนิ้วจริง">🖱 โหมดสาธิต</span>
    <span class="spacer"></span>
    <button id="pauseBtn" class="btn-glow small" title="ปุ่มลัด P">⏸ หยุดพัก</button>
  </header>

  <main class="game-area">
    <canvas id="game" class="game" aria-label="สนามเกมใต้ทะเล"></canvas>
    <div id="camBox" class="stage mirror cam-mini hidden">
      <span class="tag">กล้อง</span>
      <video id="video" playsinline muted></video>
      <canvas id="handCanvas" class="mirror"></canvas>
    </div>
    <div id="overlay" class="overlay"></div>
  </main>

  <section class="settings" aria-label="ตั้งค่าเกม">
    <button id="modeBtn" class="btn-glow ghost small">🖱 โหมดสาธิต</button>
    <button id="calmBtn" class="btn-glow ghost small">🌙 โหมดสงบ</button>
    <label id="demoBox" class="hidden">มุมกาง (สาธิต) <input id="demoRange" type="range" min="0" max="60" step="0.5" value="10"> <b id="demoVal" class="num">10</b>°</label>
    <label title="มากกว่า 1 = ไม่ต้องกางถึงค่าสูงสุดที่ปรับเทียบไว้">ความไว <input id="sensRange" type="range" min="0.6" max="1.5" step="0.05" value="1"> <b id="sensVal" class="num">1.00</b></label>
    <label class="switch">โหมดฝึก (ชนไม่เสียพลัง) <input id="practiceChk" type="checkbox"></label>
    <button id="recalBtn" class="btn-glow ghost small">🎯 ปรับเทียบใหม่</button>
    <button id="endBtn" class="btn-glow ghost small">🏁 จบเกม</button>
    <span class="muted">ค่าปรับเทียบ: <b id="calInfo">—</b> · ผู้เล่น: <b id="who">guest</b> · เตือนพักทุก <b id="restMin">5</b> นาที</span>
    <span class="muted">HandRehab Arcade · ทีม NeonHands · โรงเรียนของเรา</span>
  </section>

  <script type="module" src="js/spread-wall-page.js"></script>
<script type="module" src="js/appbar.js"></script>
</body>
</html>
