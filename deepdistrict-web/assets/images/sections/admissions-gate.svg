<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="ag-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050914"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#0a1022"/></linearGradient>
<radialGradient id="ag-sun" cx=".64" cy=".5" r=".45"><stop offset="0" stop-color="#5aa9ff" stop-opacity=".55"/><stop offset=".45" stop-color="#3b82f6" stop-opacity=".14"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<linearGradient id="ag-arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddbd9" stop-opacity="0"/><stop offset=".35" stop-color="#3ddbd9" stop-opacity=".6"/><stop offset=".64" stop-color="#e1f0ff"/><stop offset=".85" stop-color="#ffc24b" stop-opacity=".6"/><stop offset="1" stop-color="#ffc24b" stop-opacity="0"/></linearGradient>
<linearGradient id="ag-road" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity=".45"/><stop offset="1" stop-color="#3ddbd9" stop-opacity=".02"/></linearGradient>
<linearGradient id="ag-gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e09a12" stop-opacity=".2"/></linearGradient>
<linearGradient id="ag-card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17264a" stop-opacity=".92"/><stop offset="1" stop-color="#0c1530" stop-opacity=".92"/></linearGradient>
<filter id="ag-blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="ag-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#ag-sky)"/>
<rect width="1600" height="900" fill="url(#ag-sun)"/>
<!-- stars -->
<g fill="#cfe0ff" opacity=".7">
<circle cx="120" cy="90" r="1.6"/><circle cx="260" cy="160" r="1.1"/><circle cx="410" cy="70" r="1.4"/><circle cx="560" cy="130" r="1"/><circle cx="700" cy="60" r="1.5"/><circle cx="880" cy="110" r="1.1"/><circle cx="1010" cy="50" r="1.4"/><circle cx="1180" cy="120" r="1.2"/><circle cx="1330" cy="70" r="1.6"/><circle cx="1480" cy="150" r="1"/><circle cx="1540" cy="60" r="1.3"/><circle cx="340" cy="250" r="1"/><circle cx="1260" cy="230" r="1.1"/><circle cx="60" cy="280" r="1.2"/>
</g>
<!-- horizon arc (as in the DeepDistrict horizon logo) -->
<g>
<path d="M-200 640 Q800 300 1800 640" fill="none" stroke="#3b82f6" stroke-width="40" opacity=".35" filter="url(#ag-blur)"/>
<path d="M-200 640 Q800 300 1800 640" fill="none" stroke="url(#ag-arc)" stroke-width="4"/>
<ellipse cx="1024" cy="487" rx="120" ry="12" fill="#e1f0ff" opacity=".85" filter="url(#ag-blur)"/>
</g>
<!-- planet below the horizon -->
<path d="M-200 640 Q800 300 1800 640 L1800 900 L-200 900 Z" fill="#060b18"/>
<g stroke="#3b82f6" stroke-opacity=".12" fill="none">
<path d="M-100 700 Q800 420 1700 700"/><path d="M-100 770 Q800 520 1700 770"/><path d="M-100 850 Q800 630 1700 850"/>
</g>
<!-- the path rising to the gate -->
<path d="M560 900 L980 520 L1068 520 L1160 900 Z" fill="url(#ag-road)"/>
<g stroke="#3ddbd9" stroke-opacity=".55" stroke-width="3" stroke-dasharray="18 22">
<path d="M860 900 L1024 520"/>
</g>
<!-- steps on the path -->
<g fill="#7ec8ff" fill-opacity=".22" stroke="#7ec8ff" stroke-opacity=".5">
<rect x="840" y="806" width="300" height="10" rx="5"/><rect x="900" y="720" width="216" height="9" rx="4.5"/><rect x="948" y="646" width="152" height="8" rx="4"/><rect x="984" y="584" width="100" height="7" rx="3.5"/>
</g>
<!-- the gate of light -->
<g transform="translate(1024 520)">
<path d="M-58 0 L-58 -96 A58 58 0 0 1 58 -96 L58 0" fill="none" stroke="url(#ag-gate)" stroke-width="10" stroke-linecap="round"/>
<path d="M-40 0 L-40 -90 A40 40 0 0 1 40 -90 L40 0 Z" fill="#ffe29a" opacity=".22" filter="url(#ag-soft)"/>
<path d="M-12 -112 L0 -136 L12 -112 Z" fill="#ffe29a"/>
</g>
<!-- floating score cards -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
<g transform="translate(1150 150) rotate(-5)">
<rect width="250" height="112" rx="20" fill="url(#ag-card)" stroke="#3ddbd9" stroke-opacity=".6"/>
<text x="24" y="42" font-size="20" fill="#8fdcff">IELTS</text><text x="24" y="88" font-size="40" fill="#fff">7.5</text><text x="120" y="88" font-size="16" fill="#8d9ac0">BAND</text>
</g>
<g transform="translate(1320 280) rotate(4)">
<rect width="270" height="112" rx="20" fill="url(#ag-card)" stroke="#3b82f6" stroke-opacity=".7"/>
<text x="24" y="42" font-size="20" fill="#9cc2ff">SAT</text><text x="24" y="88" font-size="40" fill="#fff">1520</text><text x="150" y="88" font-size="16" fill="#8d9ac0">/1600</text>
</g>
<g transform="translate(1110 410) rotate(-3)">
<rect width="270" height="112" rx="20" fill="url(#ag-card)" stroke="#ffc24b" stroke-opacity=".75"/>
<text x="24" y="42" font-size="20" fill="#ffe29a">TBAT</text><text x="24" y="88" font-size="30" fill="#fff">PHY·CHE·BIO</text>
</g>
<g transform="translate(1330 540) rotate(5)">
<rect width="250" height="112" rx="20" fill="url(#ag-card)" stroke="#7b7bff" stroke-opacity=".7"/>
<text x="24" y="42" font-size="20" fill="#c3c3ff">CU-AAT</text><text x="24" y="88" font-size="30" fill="#fff">M · V</text>
</g>
</g>
</svg>
