<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ติดตั้งเป็นแอปได้ทุกหน้า (Lab 34) สีตรงกับ manifest.json -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#151B33">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>ประวัติการฝึก · HandRehab Arcade</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/parts.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <header class="top-bar">
    <h1>📒 ประวัติการฝึก</h1>
    <nav class="row" aria-label="เมนูเกม">
      <a class="btn-glow small" href="star-portal.html">⭐ จับดาว</a>
      <a class="btn-glow small" href="rhythm-tap.html">🎵 เคาะจังหวะ</a>
      <a class="btn-glow small" href="spread-wall.html">🐠 กางนิ้ว</a>
      <a class="btn-glow ghost small" href="achievements.html">🏅 ความสำเร็จ</a>
      <a class="btn-glow ghost small" href="progress.html">📈 กราฟ</a>
    </nav>
    <span class="spacer"></span>
    <div id="picker" class="row"></div>
  </header>
  <main class="wrap">
    <section class="card-neon filters" aria-label="ตัวกรอง">
      <label>ตั้งแต่ <input type="date" id="from"></label>
      <label>ถึง <input type="date" id="to"></label>
      <label>เกม <select id="game"><option value="">ทุกเกม</option><option value="star-portal">⭐ จับดาว (จีบนิ้ว)</option><option value="rhythm-tap">🎵 เคาะจังหวะ (แยกนิ้ว)</option><option value="spread-wall">🐠 กางนิ้ว</option></select></label>
      <label>ความรู้สึก <select id="feel">
        <option value="">ทั้งหมด</option><option value="good">🙂 ดี–สบายมาก (4-5)</option><option value="bad">😣 ไม่ค่อยดี–เหนื่อยมาก (1-2)</option>
        <option value="pain">🩹 ปวดตั้งแต่ 4/10</option><option value="none">— ยังไม่ได้บันทึก</option></select></label>
      <label title="นักกายภาพมักอยากเห็นวันที่ทำได้ไม่ดี">ความแม่นยำ <select id="acc"><option value="">ทั้งหมด</option><option value="0.6">ต่ำกว่า 60%</option><option value="0.8">ต่ำกว่า 80%</option></select></label>
      <button id="clearF" class="btn-glow ghost small">ล้างตัวกรอง</button>
    </section>
    <section class="row section" aria-label="ส่งออกและข้อมูลสาธิต">
      <span id="summary" class="chip">—</span>
      <span class="spacer" style="flex:1"></span>
      <label class="switch" title="แทนรหัสผู้ใช้ด้วยรหัส P01 และตัดบันทึกข้อความ">ส่งออกแบบไม่ระบุตัวตน <input id="anon" type="checkbox"></label>
      <button id="csvS" class="btn-glow ghost small">⬇ CSV เซสชัน</button>
      <button id="csvR" class="btn-glow ghost small">⬇ CSV ทุกท่า</button>
    </section>
    <section class="row" aria-label="ตั้งค่า">
      <label>ชื่อเครื่องนี้ <input type="text" id="machine" placeholder="เช่น โน้ตบุ๊กห้องคอม 3" style="min-width:220px"></label>
      <button id="saveMachine" class="btn-glow ghost small">💾 บันทึกชื่อเครื่อง</button>
      <span class="spacer" style="flex:1"></span>
      <button id="genDemo" class="btn-glow small">🧪 สร้างประวัติจำลอง 30 วัน</button>
      <button id="clearDemo" class="btn-glow ghost small">🧹 ลบข้อมูลจำลอง</button>
    </section>
    <section id="list" class="section col" aria-live="polite"></section>
    <p class="foot">HandRehab Arcade · ทีม NeonHands · โรงเรียนของเรา · ข้อมูลการฝึกผูกกับบุคคลถือเป็นข้อมูลสุขภาพ ส่งออกเพื่อทำรายงานให้เลือก "ไม่ระบุตัวตน"</p>
  </main>
  <script type="module" src="js/history-page.js"></script>
<script type="module" src="js/appbar.js"></script>
</body>
</html>
